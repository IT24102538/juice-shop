name: IE3142 DevSecOps Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-pipeline:
    name: Security Scan & Build
    runs-on: ubuntu-latest

    steps:

      # STEP 1: Get the code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 2: SAST - Semgrep static analysis
      - name: SAST Scan (Semgrep)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            semgrep/semgrep \
            semgrep scan \
            --config=p/security-audit \
            --error \
            --json-output=/src/semgrep-results.json \
            --metrics=off
        continue-on-error: true

      - name: Upload Semgrep SAST Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-results
          path: semgrep-results.json
          retention-days: 30

      # STEP 3: Dependency Scan - npm audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency Scan (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

      # STEP 4: Secrets Scan - Gitleaks
      - name: Secrets Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # STEP 5: Inject application secrets securely
      - name: Inject Secrets from GitHub Encrypted Secrets
        run: |
          echo "JWT_PRIVATE_KEY is set: ${{ secrets.JWT_PRIVATE_KEY != '' }}"
          echo "Secrets injected as environment variables - values never logged"
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}

      # STEP 6: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            -t juice-shop:${{ github.sha }} \
            -t juice-shop:latest \
            .

      # STEP 7: Container Scan - Trivy
      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-scan
          path: trivy-results.sarif
          retention-days: 30



